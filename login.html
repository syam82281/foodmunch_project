<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <link rel="stylesheet" href="college_project.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Roboto", sans-serif;
            background-color: #f9fbfe;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: white;
            border: 1px solid #e5eaf4;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .login-logo {
            display: block;
            margin: 0 auto 16px auto;
        }

        .login-title {
            color: #183b56;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-subtitle {
            color: #5a7184;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-label {
            color: #323f4b;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid #e5eaf4;
            border-radius: 8px;
            font-size: 14px;
            padding: 10px 14px;
            margin-bottom: 18px;
        }

        .form-control:focus {
            border-color: #d0b200;
            box-shadow: none;
        }

        .btn-login {
            color: white;
            background-image: linear-gradient(#d0b200, #a58d00);
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn-login:hover {
            background-image: linear-gradient(#a58d00, #d0b200);
            color: white;
        }

        .error-msg {
            color: red;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }

        .signup-text {
            text-align: center;
            font-size: 13px;
            color: #5a7184;
            margin-top: 20px;
            margin-bottom: 0;
        }

        .signup-text a {
            color: #d0b200;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-container">

        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/food-munch-img.png"
            class="food-munch-logo login-logo" alt="FoodMunch Logo" />

        <h1 class="login-title">Welcome Back!</h1>
        <p class="login-subtitle">Sign in to order delicious food</p>

        <p class="error-msg" id="errorMsg">Please enter a valid email and password.</p>

        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="emailInput" placeholder="Enter your email" />

        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="passwordInput" placeholder="Enter your password" />

        <button class="btn-login" onclick="handleLogin()">Login</button>

        <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>

    </div>

    <script>
        function handleLogin() {
            var email = document.getElementById('emailInput').value;
            var password = document.getElementById('passwordInput').value;
            var errorMsg = document.getElementById('errorMsg');

            if (email === '' || password === '') {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please fill in all fields.';
            } else if (!email.includes('@')) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please enter a valid email address.';
            } else if (password.length < 6) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Password must be at least 6 characters.';
            } else {
                errorMsg.style.display = 'none';
                window.location.href = 'college_project.html';
            }
        }

        document.getElementById('passwordInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>

</html>
